<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
<title>Logo agenius quadrada</title>
<desc>Versão quadrada da marca agenius: ícone com malha de nós em degradê azul, preenchendo todo o quadrado</desc>
<defs>
<linearGradient id="markGrad" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#1E5FD9"/>
<stop offset="1" stop-color="#061B3D"/>
</linearGradient>
</defs>
<rect x="0" y="0" width="300" height="300" rx="48" fill="url(#markGrad)"/>
<g stroke="#A8C8FF" stroke-width="2" opacity="0.9">
<line x1="105" y1="115" x2="160" y2="90"/>
<line x1="160" y1="90" x2="205" y2="130"/>
<line x1="105" y1="115" x2="120" y2="185"/>
<line x1="120" y1="185" x2="185" y2="205"/>
<line x1="160" y1="90" x2="205" y2="205"/>
<line x1="205" y1="130" x2="205" y2="205"/>
</g>
<g fill="#FFFFFF">
<circle cx="105" cy="115" r="8"/>
<circle cx="160" cy="90" r="8"/>
<circle cx="205" cy="130" r="8"/>
<circle cx="120" cy="185" r="8"/>
<circle cx="185" cy="205" r="8"/>
<circle cx="205" cy="205" r="8"/>
</g>
</svg>
